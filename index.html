<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Drishti ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #2e1065; /* Royal Purple (violet-950) */
            color: white;
        }
        .handwriting {
            font-family: 'Dancing Script', cursive;
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .hidden-content {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .visible-content {
            display: flex;
            opacity: 1;
        }
        /* Heartbeat animation for the final heart */
        .heartbeat {
            animation: beat 1s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

    <!-- Main Card -->
    <div class="relative z-10 text-center p-4 max-w-lg w-full flex flex-col items-center">
        
        <!-- Question Section -->
        <div id="question-section" class="flex flex-col items-center gap-6 transition-all duration-500 w-full">
            <!-- Cute Animated Header -->
            <div class="float-animation text-6xl mb-2">
                🐻❤️🐿️
            </div>

            <h1 class="text-4xl md:text-5xl font-bold text-yellow-400 drop-shadow-sm">
                Hi Drishti!
            </h1>
            
            <p class="text-2xl md:text-3xl text-white handwriting">
                Will you be my Valentine?
            </p>

            <!-- Buttons Container -->
            <div class="flex flex-wrap justify-center items-center gap-4 mt-8 w-full min-h-[100px]">
                <button 
                    id="yes-btn" 
                    onclick="acceptProposal()"
                    class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition-all duration-300 text-xl z-20 border-2 border-rose-400"
                    style="font-size: 1.25rem;"
                >
                    Yes! 🥰
                </button>

                <button 
                    id="no-btn" 
                    onclick="handleRejection()"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 text-xl"
                >
                    No 😢
                </button>
            </div>

            <!-- Feature: Open Note -->
            <div class="mt-8 w-full max-w-xs">
                <button 
                    onclick="askCupid()"
                    class="bg-transparent text-yellow-300 border-2 border-yellow-300 hover:bg-yellow-400 hover:text-purple-900 px-4 py-2 rounded-xl shadow-sm text-sm font-semibold transition flex items-center justify-center gap-2 w-full"
                >
                    <span>💌 Open Note</span>
                </button>
                <div id="cupid-response" class="hidden-content mt-3 bg-white/10 backdrop-blur-sm p-4 rounded-lg text-yellow-100 text-sm italic shadow-inner border border-yellow-500/30 font-serif leading-relaxed text-center"></div>
            </div>
        </div>

        <!-- Success Section (Hidden initially) -->
        <div id="success-section" class="hidden-content flex-col items-center gap-6 w-full max-w-md">
            <div class="text-8xl heartbeat text-rose-500">
                💖
            </div>
            <h1 class="text-4xl md:text-6xl font-bold text-yellow-400 handwriting">
                Yayyy!!
            </h1>
            <p class="text-xl md:text-2xl text-white">
                I knew you'd say yes, Drishti! <br> Can't wait for the 14th! 🌻
            </p>
            <div class="mt-4 relative group">
                <!-- PHOTO FRAME EFFECT -->
                <div class="absolute inset-0 bg-white transform rotate-3 rounded-lg shadow-lg -z-10"></div>
                
                <!-- IMPORTANT: Rename your image to 'us.jpg' and put it in the same folder as this file -->
                <img 
                    src="./us.jpg" 
                    onerror="this.src='https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3Z5ZnJ2Z3Z5ZnJ2Z3Z5ZnJ2Z3Z5ZnJ2Z3Z5ZnJ2ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/KztT2c4u8mYYUiMKdJ/giphy.gif'" 
                    alt="Us ❤️" 
                    class="mx-auto h-64 w-auto rounded-lg object-cover shadow-md border-4 border-white transform -rotate-2 transition-transform duration-300 group-hover:rotate-0"
                >
            </div>
        </div>

    </div>

    <!-- Floating Background Hearts -->
    <div id="bg-hearts" class="absolute inset-0 overflow-hidden pointer-events-none z-0 opacity-50"></div>

    <script>
        const questionSection = document.getElementById('question-section');
        const successSection = document.getElementById('success-section');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        
        // Phrases to cycle through when "No" is clicked
        const rejectionPhrases = [
            "No 😢",
            "Are you sure?",
            "Really sure?",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "You might regret this!",
            "Give it another thought!",
            "Are you absolutely certain?",
            "This could be a mistake!",
            "Have a heart!",
            "Don't be so cold!",
            "Change of heart?",
            "Wouldn't you reconsider?",
            "Is that your final answer?",
            "You're breaking my heart ;(",
            "Plsss? 🥺"
        ];

        let rejectionCount = 0;
        let currentFontSize = 1.25; // rem units

        function handleRejection() {
            rejectionCount++;
            
            // 1. Change the "No" button text
            const phraseIndex = Math.min(rejectionCount, rejectionPhrases.length - 1);
            noBtn.innerText = rejectionPhrases[phraseIndex];

            // 2. Make the "Yes" button bigger
            currentFontSize += 0.5; 
            yesBtn.style.fontSize = `${currentFontSize}rem`;
            
            // Adjust padding 
            const currentPadding = 0.75 + (rejectionCount * 0.2);
            yesBtn.style.padding = `${currentPadding}rem ${currentPadding * 2}rem`;

            // Optional: visual indication on the No button
            noBtn.style.transform = `scale(${Math.max(0.8, 1 - rejectionCount * 0.05)})`;
        }

        function acceptProposal() {
            // Trigger Confetti
            launchConfetti();

            // Hide question, show success
            questionSection.style.display = 'none';
            successSection.classList.remove('hidden-content');
            successSection.classList.add('visible-content');
            
            // Add more confetti intervals
            let duration = 3000;
            let end = Date.now() + duration;

            (function frame() {
                launchConfetti();
                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function launchConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#e11d48', '#db2777', '#f472b6', '#fbbf24'] // Pink/Red with a touch of Gold
            });
        }

        // Background floating hearts logic
        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.classList.add('absolute', 'text-2xl', 'opacity-0');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animation = `floatUp ${Math.random() * 3 + 4}s linear forwards`;
            
            document.getElementById('bg-hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Add CSS for floating hearts dynamically
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes floatUp {
                0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
                10% { opacity: 0.8; }
                100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Spawn hearts every few seconds
        setInterval(createFloatingHeart, 800);


        /* -------------------------------------------------------------------------- */
        /* STATIC CUPID LOGIC (No API Required)                                       */
        /* -------------------------------------------------------------------------- */

        function askCupid() {
            const responseDiv = document.getElementById('cupid-response');
            
            // Hardcoded poem as requested
            const poem = `
                My Dearest Squirrel,<br><br>
                Hey Squirrel, it’s your Bear writing this note,<br>
                With a heart that’s nervous, but hope-filled afloat.<br>
                Through stolen smiles and moments divine,<br>
                You’ve made every ordinary second shine.<br><br>
                So on the 14th, beneath love’s soft sign,<br>
                Will you curl up with me and be my Valentine?<br>
                Not just for the day, not just for show—<br>
                But for all the tomorrows we’re yet to know.<br><br>
                Forever your Bear 💛
            `;
            
            responseDiv.innerHTML = poem;
            responseDiv.classList.remove('hidden-content');
            responseDiv.style.display = 'block';
        }

    </script>
</body>
</html>
